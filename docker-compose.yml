version: '3'

services:
  model_training:
    build:
      context: .
      target: model_training
    volumes:
      - ./data:/data
      - ./models:/app/models
    command: python train_model.py
  
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    depends_on:
      - model_training

      